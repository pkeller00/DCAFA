[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dcafa"
version = "0.2.0"
description = "Differential community abundance (CA1, CA2) and feature association (FA1, FA2) analysis of patch-level tissue communities"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
authors = [{ name = "Piotr Keller" }]
classifiers = ["License :: Other/Proprietary License"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "patsy>=0.5",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/pkeller00/DCAFA"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
